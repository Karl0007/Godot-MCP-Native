name: Retarget v1.0.8

on:
  pull_request:
    types:
      - opened
      - reopened
      - synchronize
    paths:
      - ".github/tag-retarget-trigger"

permissions:
  contents: write

jobs:
  retarget:
    if: github.event.pull_request.head.repo.full_name == github.repository && github.event.pull_request.title == 'chore: retarget v1.0.8 tag'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0
      - name: Move v1.0.8 to the verified product commit
        env:
          TARGET_SHA: 97727060fac5fa570dbcf1ae0b8814a64cf0d6e0
        run: |
          set -euo pipefail
          git merge-base --is-ancestor "$TARGET_SHA" HEAD
          test "$(git diff --name-only "$TARGET_SHA..HEAD" | sort -u)" = ".github/workflows/retarget-v1.0.8.yml"
          git tag --force v1.0.8 "$TARGET_SHA"
          git push origin refs/tags/v1.0.8 --force
          test "$(git ls-remote origin refs/tags/v1.0.8 | awk '{print $1}')" = "$TARGET_SHA"
